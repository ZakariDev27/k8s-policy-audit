# Walkthrough step 2: storage controls fixed (quota, single-writer claim, size limit, read-only root).
apiVersion: v1
kind: Namespace
metadata:
  name: notes
---
# API access: the default service account can edit everything in the namespace,
# including reading its Secrets and exec-ing into pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: notes-edit
  namespace: notes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: default
    namespace: notes
---
# Storage: cap what the namespace can claim.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: storage
  namespace: notes
spec:
  hard:
    persistentvolumeclaims: "2"
    requests.storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notes-data
  namespace: notes
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes
  namespace: notes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes
  template:
    metadata:
      labels:
        app: notes
    spec:
      containers:
        - name: notes
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: notes-data
        - name: tmp
          emptyDir: 
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notes
  namespace: notes
spec:
  type: ClusterIP
  selector:
    app: notes
  ports:
    - port: 80
      targetPort: 8080
---
# Network: nothing in or out unless a later policy allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: notes
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# Network: only the ingress controller may reach the app.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notes
  namespace: notes
spec:
  podSelector:
    matchLabels:
      app: notes
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
